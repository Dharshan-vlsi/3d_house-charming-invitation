<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait 3D Housewarming Invitation</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; overflow-x: hidden;
    background: radial-gradient(ellipse at center, #eafaff 0%, #bcefff 52%, #69c8ed 100%);
    font-family: Georgia, "Noto Serif Tamil", serif;
  }
  .stage { width: min(100%, 560px); display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .book-wrap { width: min(100%, 520px); perspective: 1800px; }
  .book {
    position: relative; width: 100%; aspect-ratio: 1055 / 1412;
    transform-style: preserve-3d; filter: drop-shadow(0 22px 28px rgba(0,65,105,.28));
  }
  .page {
    position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
    backface-visibility: hidden; transform-style: preserve-3d;
    background: #e7faff; border: 5px solid rgba(255,255,255,.92);
    box-shadow: inset 0 0 0 1px rgba(0,95,150,.22);
  }
  .page img { display:block; width:100%; height:100%; object-fit:fill; }
  .cover {
    z-index: 2; transform-origin: left center;
    transition: transform 1.25s cubic-bezier(.2,.72,.18,1), box-shadow 1.25s ease;
  }
  .inside {
    z-index: 1; transform: rotateY(0deg);
  }
  .book.open .cover {
    transform: rotateY(-172deg);
    box-shadow: 12px 0 26px rgba(0,45,75,.24);
  }
  .spine {
    position:absolute; z-index:3; top:1%; bottom:1%; left:0;
    width:7px; transform:translateX(-50%);
    background:linear-gradient(90deg,rgba(0,67,111,.28),rgba(255,255,255,.75),rgba(0,67,111,.12));
    pointer-events:none; opacity:.8;
  }
  .controls { display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap; }
  button {
    border: 0; border-radius: 999px; padding: 13px 28px; min-width: 150px;
    font-size: 16px; font-weight: 700; letter-spacing:.2px; cursor:pointer;
    color:white; background:linear-gradient(135deg,#0757a8,#078bc2);
    box-shadow:0 8px 18px rgba(0,75,125,.25);
    transition: transform .18s ease, opacity .18s ease;
  }
  button:hover { transform:translateY(-2px); }
  button:focus-visible { outline:3px solid #ffcf52; outline-offset:4px; }
  button:disabled { opacity:.45; cursor:default; transform:none; }
  .hint { margin:0; color:#064c79; font: 14px/1.5 system-ui,sans-serif; text-align:center; }
  @media (max-width:600px) {
    body { padding:12px; }
    .book-wrap { width:min(100%, 440px); }
    .book { aspect-ratio: 1055 / 1412; }
    .page { border-width:3px; border-radius:10px; }
    button { min-width:130px; padding:12px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cover { transition-duration:.01ms; }
  }
</style>
</head>

<script>
  const book = document.getElementById('book');
  const openBtn = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const status = document.getElementById('status');
  function setOpen(isOpen) {
    book.classList.toggle('open', isOpen);
    openBtn.disabled = isOpen;
    closeBtn.disabled = !isOpen;
    status.textContent = isOpen
      ? 'Invitation opened. Select “Close invitation” to return to the front page.'
      : 'The front page is shown in portrait view. Select “Open invitation” to turn to the inside page.';
  }
  openBtn.addEventListener('click', () => setOpen(true));
  closeBtn.addEventListener('click', () => setOpen(false));
</script>
